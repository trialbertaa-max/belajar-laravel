<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title>Skeleton Test</title>
<style>
body { background: #0b111e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.skeleton-box { width: 220px; height: 480px; position: relative; background: #070d17; border-radius: 12px; border: 1px solid #1e293b; display: flex; justify-content: center; align-items: center; }
.body-part { cursor: pointer; transition: all 0.25s ease; fill: rgba(34, 211, 238, 0.05); stroke: #0ea5e9; stroke-width: 1.5; }
.body-part:hover { fill: rgba(6, 182, 212, 0.25); stroke: #38bdf8; filter: drop-shadow(0 0 6px #00f0ff); }
.body-part.active { fill: rgba(6, 182, 212, 0.45); stroke: #22d3ee; stroke-width: 2.2; filter: drop-shadow(0 0 10px #00f0ff); }
</style>
</head>
<body>
<div class='skeleton-box'>
<svg viewBox='0 0 200 480' width='100%' height='100%' style='filter: drop-shadow(0 0 8px rgba(6,182,212,0.2));'>
    <!-- Head -->
    <g class='body-part' id='part-head' data-part='head' data-name='Head / Skull'>
        <ellipse cx='100' cy='45' rx='20' ry='24' />
        <path d='M90 60 Q100 75 110 60 Z' />
        <!-- eyes / nose sockets -->
        <circle cx='93' cy='42' r='4' fill='#070d17' stroke='none'/>
        <circle cx='107' cy='42' r='4' fill='#070d17' stroke='none'/>
        <polygon points='100,48 98,54 102,54' fill='#070d17' stroke='none'/>
    </g>
    <!-- Spine -->
    <g class='body-part' id='part-spine' data-part='spine' data-name='Spine'>
        <rect x='96' y='76' width='8' height='160' rx='3' />
        <line x1='93' y1='85' x2='107' y2='85' />
        <line x1='93' y1='100' x2='107' y2='100' />
        <line x1='93' y1='120' x2='107' y2='120' />
        <line x1='93' y1='140' x2='107' y2='140' />
        <line x1='93' y1='160' x2='107' y2='160' />
        <line x1='93' y1='180' x2='107' y2='180' />
        <line x1='93' y1='200' x2='107' y2='200' />
        <line x1='93' y1='220' x2='107' y2='220' />
        <!-- Sacrum / Coccyx -->
        <polygon points='100,248 93,225 107,225' />
    </g>
    <!-- Thorax -->
    <g class='body-part' id='part-thorax' data-part='thorax' data-name='Thorax'>
        <path d='M100 85 Q75 88 58 100 Q80 102 100 88' />
        <path d='M100 85 Q125 88 142 100 Q120 102 100 88' />
        <!-- Ribs Right -->
        <path d='M96 110 Q65 112 60 125 Q80 130 96 122' />
        <path d='M96 125 Q62 130 58 145 Q80 150 96 137' />
        <path d='M96 140 Q60 148 57 165 Q80 168 96 152' />
        <path d='M96 155 Q62 165 60 182 Q80 182 96 167' />
        <!-- Ribs Left -->
        <path d='M104 110 Q135 112 140 125 Q120 130 104 122' />
        <path d='M104 125 Q138 130 142 145 Q120 150 104 137' />
        <path d='M104 140 Q140 148 143 165 Q120 168 104 152' />
        <path d='M104 155 Q138 165 140 182 Q120 182 104 167' />
        <!-- Sternum -->
        <rect x='97' y='96' width='6' height='60' rx='2' />
    </g>
    <!-- Right Arm -->
    <g class='body-part' id='part-right_arm' data-part='right_arm' data-name='Right Upper Limb'>
        <!-- Clavicle joint & Scapula -->
        <circle cx='54' cy='105' r='5' />
        <!-- Humerus -->
        <path d='M54 108 Q45 145 40 180' stroke-width='4' stroke-linecap='round' />
        <!-- Elbow -->
        <circle cx='40' cy='182' r='4' />
        <!-- Forearm (Radius / Ulna) -->
        <path d='M39 185 Q30 220 25 255' stroke-width='3' stroke-linecap='round' />
        <!-- Hand / Fingers -->
        <ellipse cx='22' cy='268' rx='5' ry='8' />
        <path d='M19 275 L16 288 M22 276 L21 292 M25 276 L26 290 M27 274 L30 285' stroke-width='1.5' />
    </g>
    <!-- Left Arm -->
    <g class='body-part' id='part-left_arm' data-part='left_arm' data-name='Left Upper Limb'>
        <circle cx='146' cy='105' r='5' />
        <path d='M146 108 Q155 145 160 180' stroke-width='4' stroke-linecap='round' />
        <circle cx='160' cy='182' r='4' />
        <path d='M161 185 Q170 220 175 255' stroke-width='3' stroke-linecap='round' />
        <ellipse cx='178' cy='268' rx='5' ry='8' />
        <path d='M175 275 L172 288 M178 276 L179 292 M181 276 L182 290 M183 274 L186 285' stroke-width='1.5' />
    </g>
    <!-- Pelvis -->
    <g class='body-part' id='part-pelvis' data-part='pelvis' data-name='Pelvis & Abdomen'>
        <path d='M85 210 Q68 215 70 235 Q75 255 90 255 Q100 255 100 245 Q100 255 110 255 Q125 255 130 235 Q132 215 115 210 Q100 215 85 210 Z' />
        <!-- Pelvic cavities -->
        <ellipse cx='86' cy='238' rx='6' ry='8' fill='#070d17' />
        <ellipse cx='114' cy='238' rx='6' ry='8' fill='#070d17' />
    </g>
    <!-- Right Leg -->
    <g class='body-part' id='part-right_leg' data-part='right_leg' data-name='Right Lower Limb'>
        <!-- Femur -->
        <path d='M82 258 Q80 305 78 350' stroke-width='5' stroke-linecap='round' />
        <!-- Knee -->
        <circle cx='78' cy='355' r='5' />
        <!-- Tibia / Fibula -->
        <path d='M78 360 Q76 405 74 445' stroke-width='4' stroke-linecap='round' />
        <!-- Foot -->
        <path d='M74 447 Q65 458 60 465 L76 465 Z' />
    </g>
    <!-- Left Leg -->
    <g class='body-part' id='part-left_leg' data-part='left_leg' data-name='Left Lower Limb'>
        <path d='M118 258 Q120 305 122 350' stroke-width='5' stroke-linecap='round' />
        <circle cx='122' cy='355' r='5' />
        <path d='M122 360 Q124 405 126 445' stroke-width='4' stroke-linecap='round' />
        <path d='M126 447 Q135 458 140 465 L124 465 Z' />
    </g>
</svg>
</div>
</body>
</html>
